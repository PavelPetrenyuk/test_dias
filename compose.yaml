services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-article_masks}
      POSTGRES_USER: ${POSTGRES_USER:-article_masks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в файле .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: .
    command: uvicorn article_masks.api:app --host 0.0.0.0 --port 8000
    environment: &application-environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-article_masks}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-article_masks}
      API_TOKEN: ${API_TOKEN:?Укажите API_TOKEN в файле .env}
      DATA_DIRECTORY: /data
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - article-data:/data
    restart: unless-stopped

  worker:
    build: .
    command: article-masks-worker
    environment:
      <<: *application-environment
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - article-data:/data
    restart: unless-stopped

volumes:
  article-data:
  postgres-data:
